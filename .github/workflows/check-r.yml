name: Check R project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install spatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libfontconfig1-dev libfreetype6-dev libpng-dev libjpeg-dev libtiff-dev
      - name: Install R dependencies
        run: Rscript scripts/01_install.R
      - name: Parse all R scripts
        run: Rscript -e 'for (f in list.files(".", pattern="[.]R$", recursive=TRUE, full.names=TRUE)) parse(f)'
      - name: Test helpers and exports
        run: Rscript tests/run_tests.R
      - name: Exercise demo workflow
        run: |
          Rscript scripts/02_create_demo.R
          Rscript scripts/04_script_example.R
      - name: Check Shiny construction
        run: Rscript -e 'app <- source("app.R")$value; stopifnot(inherits(app, "shiny.appobj"))'
      - name: Upload demo exports
        uses: actions/upload-artifact@v4
        with:
          name: demo-maps
          path: outputs/
